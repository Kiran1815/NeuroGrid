<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#E67E22" />
  <meta name="description"
    content="Offline-first mesh communication for disaster survivors — NeuroGrid Disaster Intelligence Platform" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NeuroGrid" />
  <link rel="manifest" href="/manifest.json" />
  <title>NeuroGrid — Disaster Intelligence</title>

  <!-- Capture beforeinstallprompt BEFORE React mounts — it fires very early -->
  <script>
    window.__pwaInstallEvent = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__pwaInstallEvent = e;
      // Notify React app if it's already mounted
      window.dispatchEvent(new Event('pwa-install-ready'));
    });
    window.addEventListener('appinstalled', function () {
      window.__pwaInstallEvent = null;
      window.dispatchEvent(new Event('pwa-installed'));
    });
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
